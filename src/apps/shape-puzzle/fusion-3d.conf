[fusion-core]
ENABLED = YES
ENGINE = 3d
STRATEGY = rule-based
LOW_CONFIDENCE_POLICY = ignore
UNKNOWN_INPUT_POLICY = ignore

[fusion-timing]
TEMPORAL_WINDOW = 1.5s
GESTURE_HISTORY = 3s
VOICE_HISTORY = 3s

[fusion-confidence]
VOICE_MIN_CONFIDENCE = 0.60
GESTURE_MIN_CONFIDENCE = 0.60
FUSED_MIN_CONFIDENCE = 0.65

[fusion-context]
RECENT_EVENT_LIMIT = 20
REMEMBER_POINTER = YES
REMEMBER_SELECTED_TARGET = YES
REMEMBER_PINCH_DISTANCE = YES
CLEAR_SELECTION_ON_RELEASE = NO

[fusion-pointer]
SOURCE = index-finger
EMIT_UPDATE_POINTER = YES
EMIT_POINTER_DELTA = YES
EMIT_PALM_DELTA = YES
EMIT_PINCH_DELTA = YES

[fusion-voice-include]
INTENTS = create-sphere, create-cube, create-cuboid, create-diamond, select, move-here, drag, rotate, resize, done, insert, restart, delete

[fusion-voice.intent.create-sphere]
PHRASES = create sphere, make sphere, add sphere

[fusion-voice.intent.create-cube]
PHRASES = create cube, make cube, add cube

[fusion-voice.intent.create-cuboid]
PHRASES = create cuboid, make cuboid, add cuboid

[fusion-voice.intent.create-diamond]
PHRASES = create diamond, make diamond, add diamond

[fusion-voice.intent.select]
PHRASES = select, choose this, pick this

[fusion-voice.intent.move-here]
PHRASES = move here, move there, place here, put here

[fusion-voice.intent.drag]
PHRASES = drag, start drag, move with hand

[fusion-voice.intent.rotate]
PHRASES = rotate, start rotate, spin

[fusion-voice.intent.resize]
PHRASES = resize, scale, start resize

[fusion-voice.intent.done]
PHRASES = done, finish, stop, drop

[fusion-voice.intent.insert]
PHRASES = insert, lock in, place it

[fusion-voice.intent.restart]
PHRASES = restart, reset game, start over

[fusion-voice.intent.delete]
PHRASES = delete, delete this
REQUIRES_CONFIRMATION = YES

[fusion-gesture-include]
GESTURES = point, pinch, grab, release, open_palm, fist

[fusion-action.voice.create-cube]
ACTION = create_object
OBJECT_TYPE = cube
USE_POSITION = YES

[fusion-action.voice.create-sphere]
ACTION = create_object
OBJECT_TYPE = sphere
USE_POSITION = YES

[fusion-action.voice.create-cuboid]
ACTION = create_object
OBJECT_TYPE = cuboid
USE_POSITION = YES

[fusion-action.voice.create-diamond]
ACTION = create_object
OBJECT_TYPE = diamond
USE_POSITION = YES

[fusion-action.voice.select]
ACTION = select_object
USE_POSITION = YES

[fusion-action.voice.move-here]
ACTION = move_object
USE_POSITION = YES

[fusion-action.voice.drag]
ACTION = set_interaction_mode
MODE = dragging

[fusion-action.voice.rotate]
ACTION = set_interaction_mode
MODE = rotating

[fusion-action.voice.resize]
ACTION = set_interaction_mode
MODE = resizing

[fusion-action.voice.done]
ACTION = set_interaction_mode
MODE = idle

[fusion-action.voice.insert]
ACTION = insert_object

[fusion-action.voice.restart]
ACTION = reset_app

[fusion-action.voice.delete]
ACTION = delete_object
