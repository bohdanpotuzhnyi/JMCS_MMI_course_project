[fusion-core]
ENABLED = YES
ENGINE = 2d
STRATEGY = rule-based
LOW_CONFIDENCE_POLICY = ignore
UNKNOWN_INPUT_POLICY = ignore

[fusion-timing]
TEMPORAL_WINDOW = 1.5s

[fusion-confidence]
VOICE_MIN_CONFIDENCE = 0.60
GESTURE_MIN_CONFIDENCE = 0.60
FUSED_MIN_CONFIDENCE = 0.65

[fusion-context]
RECENT_EVENT_LIMIT = 20
REMEMBER_POINTER = YES
REMEMBER_SELECTED_TARGET = YES
CLEAR_SELECTION_ON_RELEASE = NO

[fusion-pointer]
SOURCE = index-finger
EMIT_UPDATE_POINTER = NO
EMIT_POINTER_DELTA = NO
EMIT_PALM_DELTA = NO
EMIT_PINCH_DELTA = NO

[fusion-voice-include]
INTENTS = left, right, up, down, rotate-left, rotate-right

[fusion-voice.intent.left]
PHRASES = move left, go left, left

[fusion-voice.intent.right]
PHRASES = move right, go right, right

[fusion-voice.intent.up]
PHRASES = move up, go up, up

[fusion-voice.intent.down]
PHRASES = move down, go down, down

[fusion-voice.intent.rotate-left]
PHRASES = rotate left, turn left, counterclockwise, counter-clockwise

[fusion-voice.intent.rotate-right]
PHRASES = rotate right, turn right, clockwise

[fusion-gesture-include]
GESTURES = point, pinch, grab, release, swipe_left, swipe_right, swipe_up, swipe_down

[fusion-action.voice.left]
ACTION = move_object
DX = -0.10
DY = 0.00

[fusion-action.voice.right]
ACTION = move_object
DX = 0.10
DY = 0.00

[fusion-action.voice.up]
ACTION = move_object
DX = 0.00
DY = -0.10

[fusion-action.voice.down]
ACTION = move_object
DX = 0.00
DY = 0.10

[fusion-action.voice.rotate-left]
ACTION = rotate_object
ROTATION = -15

[fusion-action.voice.rotate-right]
ACTION = rotate_object
ROTATION = 15

[fusion-action.gesture.point]
ACTION = select_object
USE_POSITION = YES

[fusion-action.gesture.release]
ACTION = deselect_object
